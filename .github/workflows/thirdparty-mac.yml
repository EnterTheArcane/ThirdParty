name: ThirdParty Mac

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      recipes:
        required: false
        type: string
        default: ""
      publish:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        required: false
        type: choice
        options:
          - ARM
          - X64
        default: ARM
      publish:
        description: Publish OCI images to GHCR
        required: false
        type: boolean
        default: false
      recipes:
        description: Recipes to build (space-delimited names or globs; blank = all)
        required: false
        type: string
        default: ""

run-name: Mac ${{ inputs.arch }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pip Install
        run: python -m pip install -e "."

      - name: Build
        timeout-minutes: 330
        run: >-
          thirdparty build
          --target-arch ${{ inputs.arch }}
          ${{ inputs.recipes }}

      - name: Package Images
        if: ${{ !cancelled() && inputs.publish }}
        run: >-
          thirdparty oci build ${{ inputs.recipes }}
          --target-arch ${{ inputs.arch }}

      - name: Push Images
        if: ${{ !cancelled() && inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          thirdparty oci push ${{ inputs.recipes }}
          --target-arch ${{ inputs.arch }}
