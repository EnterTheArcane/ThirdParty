name: ThirdParty Mac

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        required: false
        type: choice
        options:
          - ARM
          - X64
        default: ARM

run-name: Mac ${{ inputs.arch }}

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pip Install
        run: python -m pip install -e "."

      - name: Build
        timeout-minutes: 330
        run: >-
          thirdparty build
          --target-arch ${{ inputs.arch }}
