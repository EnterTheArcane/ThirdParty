name: ThirdParty

run-name: ThirdParty - ${{ github.ref_name }}

on:
  push:
  workflow_dispatch:
    inputs:
      mac_arm:
        description: Mac ARM
        type: boolean
        required: false
        default: true
      mac_x64:
        description: Mac X64
        type: boolean
        required: false
        default: true
      linux_arm:
        description: Linux ARM
        type: boolean
        required: false
        default: true
      linux_x64:
        description: Linux X64
        type: boolean
        required: false
        default: true
      windows_arm:
        description: Windows ARM
        type: boolean
        required: false
        default: true
      windows_x64:
        description: Windows X64
        type: boolean
        required: false
        default: true
      recipes:
        description: Recipes
        type: string
        required: false
        default: ""
      publish:
        description: Publish
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  linux-arm:
    name: Linux-ARM
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_arm }}
    uses: ./.github/workflows/thirdparty-linux.yml
    with:
      arch: ARM
      recipes: ${{ inputs.recipes }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}

  linux-x64:
    name: Linux-X64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_x64 }}
    uses: ./.github/workflows/thirdparty-linux.yml
    with:
      arch: X64
      recipes: ${{ inputs.recipes }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}

  mac-arm:
    name: Mac-ARM
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac_arm }}
    uses: ./.github/workflows/thirdparty-mac.yml
    with:
      arch: ARM
      recipes: ${{ inputs.recipes }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}

  mac-x64:
    name: Mac-X64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac_x64 }}
    uses: ./.github/workflows/thirdparty-mac.yml
    with:
      arch: X64
      recipes: ${{ inputs.recipes }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}

  windows-arm:
    name: Windows-ARM
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_arm }}
    uses: ./.github/workflows/thirdparty-windows.yml
    with:
      arch: ARM
      recipes: ${{ inputs.recipes }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}

  windows-x64:
    name: Windows-X64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_x64 }}
    uses: ./.github/workflows/thirdparty-windows.yml
    with:
      arch: X64
      recipes: ${{ inputs.recipes }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}

  combine:
    name: Combine
    needs:
      - linux-arm
      - linux-x64
      - mac-arm
      - mac-x64
      - windows-arm
      - windows-x64
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pip Install
        run: python -m pip install -e "."

      - name: Combine Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: thirdparty oci combine ${{ inputs.recipes }}
